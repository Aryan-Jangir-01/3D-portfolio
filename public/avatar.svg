<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a0a12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2438"/>
      <stop offset="100%" stop-color="#0d101d"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="50%" stop-color="#e2847a"/>
      <stop offset="100%" stop-color="#a84343"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2233"/>
      <stop offset="100%" stop-color="#120c18"/>
    </linearGradient>
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a5f"/>
      <stop offset="50%" stop-color="#ff7b00"/>
      <stop offset="100%" stop-color="#ff2a5f"/>
    </linearGradient>
  </defs>

  <!-- Ambient Backlight -->
  <circle cx="250" cy="280" r="220" fill="url(#bgGlow)"/>

  <!-- Shoulders / Torso -->
  <path d="M 120 620 C 130 500, 160 450, 210 430 L 250 460 L 290 430 C 340 450, 370 500, 380 620 Z" fill="url(#bodyGrad)" stroke="#ff3366" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Collar / Shirt Detail -->
  <path d="M 210 430 L 250 510 L 290 430" fill="none" stroke="#ff3366" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M 235 440 L 250 490 L 265 440" fill="#0d101d"/>

  <!-- Neck -->
  <path d="M 220 380 L 220 440 Q 250 455 280 440 L 280 380 Z" fill="url(#faceGrad)"/>
  <path d="M 220 380 L 220 440" stroke="#ff3366" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M 280 380 L 280 440" stroke="#ff3366" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Face / Head Base -->
  <path d="M 195 240 C 195 180, 305 180, 305 240 C 305 320, 285 390, 250 395 C 215 390, 195 320, 195 240 Z" fill="url(#faceGrad)"/>

  <!-- Hair / Bun (Modern Cyber Cut) -->
  <!-- Top Bun -->
  <ellipse cx="250" cy="140" rx="36" ry="32" fill="url(#hairGrad)" stroke="#ff3366" stroke-width="1.5" stroke-opacity="0.5"/>
  <ellipse cx="250" cy="140" rx="30" ry="24" fill="#181122"/>
  <!-- Main Hair Volume -->
  <path d="M 190 230 C 185 160, 220 145, 250 145 C 280 145, 315 160, 310 230 C 310 190, 280 170, 250 170 C 220 170, 190 190, 190 230 Z" fill="url(#hairGrad)" stroke="#ff3366" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Eyebrows -->
  <path d="M 215 250 Q 230 245 240 252" stroke="#1f1525" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 260 252 Q 270 245 285 250" stroke="#1f1525" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <ellipse cx="228" cy="265" rx="8" ry="5" fill="#ffffff"/>
  <circle cx="228" cy="265" r="3.5" fill="#1b1220"/>
  <circle cx="229" cy="263" r="1.2" fill="#ffffff"/>

  <ellipse cx="272" cy="265" rx="8" ry="5" fill="#ffffff"/>
  <circle cx="272" cy="265" r="3.5" fill="#1b1220"/>
  <circle cx="273" cy="263" r="1.2" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M 250 262 L 246 295 L 254 295" stroke="#9e3a3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Lips / Confident Developer Smile -->
  <path d="M 236 325 Q 250 338 264 325" stroke="#882233" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 238 325 Q 250 333 262 325" fill="#ffffff" fill-opacity="0.8"/>

  <!-- Cyber Ear Piece / Neon Accent -->
  <path d="M 194 260 Q 186 280 195 295" stroke="#ff3366" stroke-width="3" fill="none"/>
  <circle cx="191" cy="285" r="3" fill="#ff7b00"/>
  <path d="M 306 260 Q 314 280 305 295" stroke="#ff3366" stroke-width="3" fill="none"/>
  <circle cx="309" cy="285" r="3" fill="#ff7b00"/>

  <!-- Futuristic Holographic Contour Grid Lines -->
  <path d="M 140 550 Q 250 490 360 550" stroke="url(#neonRim)" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.4" fill="none"/>
  <path d="M 160 580 Q 250 530 340 580" stroke="url(#neonRim)" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.3" fill="none"/>
</svg>
